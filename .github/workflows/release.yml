name: Build and Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Needed for hive_generator. Remove this step if you commit your *.g.dart files.
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # OPTIONAL: reuse your local debug key so every APK has the same signature.
      # Does nothing if the DEBUG_KEYSTORE_BASE64 secret doesn't exist.
      - name: Use fixed debug keystore (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed debug keystore"
          else
            echo "No debug keystore secret, using a generated one"
          fi

      - name: Read app version from pubspec
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/testing_firebase-${{ steps.version.outputs.tag }}.apk

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/app/outputs/flutter-apk/testing_firebase-${{ steps.version.outputs.tag }}.apk" \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes "Automated release build #${{ github.run_number }}"